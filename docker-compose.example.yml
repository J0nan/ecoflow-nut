# ecoflow-nut — example deployment.
#
# Copy this file to docker-compose.yml (or docker-compose.override.yml) and run:
#
#   MON_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
#
# MON_PASSWORD must be the same value you configure as the monitor password on
# the NUT slave (TrueNAS). Keep it out of version control; a .env file next to
# this compose file is the usual place.
services:
  ecoflow-nut:
    image: j0nan/ecoflow-nut:latest
    container_name: ecoflow-nut
    restart: unless-stopped
    stop_grace_period: 30s

    # The driver must open the USB device node and the entrypoint must fix
    # ownership of /etc/nut, so it runs as root inside the container. These
    # options keep the rest of the container powerless.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # chown root:nut on the rendered configs
      - DAC_OVERRIDE # read the 0640 configs and the USB device node
      - FOWNER       # chmod files this process does not own
      - SETGID
      - SETUID

    environment:
      UPS_NAME: ecoflow
      UPS_DESC: EcoFlow Delta 3 Plus
      MON_USER: monuser
      MON_PASSWORD: ${MON_PASSWORD:?set MON_PASSWORD, for example in a .env file next to this compose file}
      OVERRIDE_BATTERY_CHARGE_LOW: "30"

    ports:
      - "3493:3493"

    # USB passthrough: map the whole bus. For tighter security, map only the
    # specific /dev/bus/usb/BBB/DDD node the EcoFlow enumerates on.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'    # USB char devices

    # If hotplug re-enumeration breaks access, fall back to:
    # privileged: true

    # Optional extra hardening, verified with the dummy-ups smoke test:
    #   read_only: true          (needs the tmpfs below plus a writable
    #                             /etc/nut volume or mount mode)
    #   tmpfs:
    #     - /run                 (driver socket, pid and healthcheck target)
